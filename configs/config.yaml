# Small, pinned summer-2023 proof of concept; all paths are relative to project root.
seed: 42
study_area:
  name: Long Beach, CA
  unit: tract
  place_geoid: "0643000"
  county_fips: "037"
landsat:
  collection: landsat-c2-l2
  scene_ids:
    - LC08_L2SP_041036_20230712_02_T1
    - LC09_L2SP_041036_20230805_02_T1
    - LC08_L2SP_041036_20230829_02_T1
features:
  predictors: [ndvi, ndbi, ndwi]
  exclude_from_model: [lwir11, st_b10, lst_celsius]
  min_valid_pixels: 30
  min_valid_fraction: 0.5
modeling:
  target: lst_celsius
  group_column: unit_id
  n_splits: 5
  models: [mean_baseline, linear, random_forest]
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: results
