name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: |
          pip install numpy pandas scikit-learn pyyaml pytest ruff
          pip install -e . --no-deps
      - run: ruff check src tests app
      - run: pytest
